services:
  - type: web
    name: last-phone-standing-server
    runtime: docker
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    plan: free
    branch: final-presentation

  - type: web
    name: last-phone-standing
    runtime: static
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: ./client/dist
    branch: final-presentation
    envVars:
      - key: VITE_WS_URL
        value: wss://last-phone-standing-server.onrender.com
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
